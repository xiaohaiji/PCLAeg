<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Aegisub Launcher</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-icon">A<span>◈</span></span><div>Aegisub <b>Launcher</b></div></div><nav id="navigation"><button data-page="home" class="active">启动</button><button data-page="versions">版本管理</button><button data-page="downloads">下载</button><button data-page="plugins">插件中心</button><button data-page="settings">设置</button></nav><span class="edition">PCLAeg · 0.2.3</span></header>
  <div class="layout"><aside>
    <div class="launch-card"><div class="eyebrow current-label">当前版本</div><h2 id="side-name">还没有创作环境</h2><p id="side-version">添加一个版本，即可开始</p><div class="select-wrap"><select id="instance-select" aria-label="当前实例"><option value="">选择版本实例</option></select></div><button id="launch" class="primary launch-btn">▷ <span>启动 Aegisub</span></button><div class="side-tools"><button data-action="go-versions">管理版本</button><span></span><button data-action="open-instance">打开目录</button></div></div>
    <div class="aside-section"><div class="eyebrow">环境状态</div><div class="status-line"><i class="dot"></i>版本隔离 <b>独立目录</b></div><div class="status-line"><i class="dot blue"></i>插件隔离 <b id="side-count">0 个插件</b></div><div class="status-line"><i class="dot pale"></i>配置存储 <b>本地保存</b></div></div>
    <div class="aside-bottom">A subtitle workspace, made yours.</div>
  </aside><main id="content"></main></div>
  <div id="task" class="task hidden"><div><span class="spinner"></span><b id="task-label">正在处理…</b><span id="task-percent"></span><button id="cancel-task" class="text-button">取消下载</button></div><div class="progress-track"><i id="task-bar"></i></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="modal"><form id="modal-form"><div class="modal-top"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="icon-button" aria-label="关闭">×</button></div><p id="modal-description"></p><label id="modal-label" for="modal-input">实例名称</label><input id="modal-input" maxlength="80" required autocomplete="off"><div id="modal-extra"></div><div class="modal-actions"><button type="button" id="modal-cancel" class="button">取消</button><button class="primary" type="submit">确定</button></div></form></dialog>
  <script src="renderer.js"></script>
</body></html>
